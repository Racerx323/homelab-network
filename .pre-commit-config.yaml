---
minimum_pre_commit_version: "3.6.2"
default_stages: [pre-commit]
exclude: (?:^|/)(?:\.vexp|\.agents)/

repos:
  - repo: local
    hooks:
      - id: munin-master-profile-offline
        name: Munin master profile persistence offline tests
        entry: python3 -I -B Ubiquiti/munin-master-profile/test_persist.py
        language: system
        files: ^Ubiquiti/munin-master-profile/
        pass_filenames: false

      - id: munin-network-readiness-offline
        name: Munin master static-network readiness offline tests
        entry: python3 -I -B Ubiquiti/munin-master-profile/test_inspect.py
        language: system
        files: ^Ubiquiti/munin-master-profile/
        pass_filenames: false

      - id: munin-network-guard-offline
        name: Native network checkpoint offline contracts
        entry: python3 -I -B Ubiquiti/munin-master-profile/test_guard.py
        language: system
        files: ^Ubiquiti/munin-master-profile/
        pass_filenames: false

      - id: svmf-network-deployment-offline
        name: svmf supervised network deployment contracts
        entry: python3 -I -B Ubiquiti/munin-master-profile/test_deploy.py
        language: system
        files: ^(?:Ubiquiti/munin-master-profile/|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: svmf-dashboard-probe-offline
        name: svmf bounded dashboard diagnostic contracts
        entry: python3 -I -B Ubiquiti/munin-master-profile/test_probe_dashboard.py
        language: system
        files: ^(?:Ubiquiti/munin-master-profile/|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: svmf-apache-qualification-offline
        name: svmf read-only Apache and verified TLS qualification contracts
        entry: python3 -I -B Ubiquiti/munin-master-profile/test_qualify_dashboard.py
        language: system
        files: ^(?:Ubiquiti/munin-master-profile/|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: svmf-graph-qualification-offline
        name: svmf targeted verified HTTPS graph discovery contracts
        entry: python3 -I -B Ubiquiti/munin-master-profile/test_qualify_graph.py
        language: system
        files: ^(?:Ubiquiti/munin-master-profile/|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: svmf-preflight-diagnostic-offline
        name: svmf read-only failed-preflight diagnostic contracts
        entry: python3 -I -B Ubiquiti/munin-master-profile/test_diagnose_preflight.py
        language: system
        files: ^(?:Ubiquiti/munin-master-profile/|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: ntp-ipv6-offline
        name: NTP IPv6 firewall transaction offline tests
        entry: python3 -B -m unittest discover -s Ubiquiti/ntp-ipv6/tests -v
        language: system
        files: ^(?:Ubiquiti/ntp-ipv6/|Ubiquiti/UNIFI_ACCESS\.md$)
        pass_filenames: false

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: shfmt -d -i 4 -ci
        language: system
        types: [shell]

      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        types: [markdown]
        exclude: >-
          (?:^|/)AGENTS\.md$|^(?:LICENSE\.md|\.github/copilot-instructions\.md)$

      - id: yamllint
        name: yamllint
        entry: yamllint --strict
        language: system
        types: [yaml]

      - id: actionlint
        name: Validate GitHub Actions workflows
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

      - id: check-github-issue-forms
        name: Validate GitHub issue forms
        entry: >-
          check-jsonschema --builtin-schema vendor.github-issue-forms
        language: system
        types: [yaml]
        files: >-
          ^\.github/ISSUE_TEMPLATE/(?!config\.ya?ml$)[^/]+\.ya?ml$

      - id: check-github-issue-config
        name: Validate GitHub issue configuration
        entry: >-
          check-jsonschema --builtin-schema vendor.github-issue-config
        language: system
        types: [yaml]
        files: ^\.github/ISSUE_TEMPLATE/config\.ya?ml$

      - id: check-compose
        name: Validate Compose configuration
        entry: check-jsonschema --builtin-schema vendor.compose-spec
        language: system
        types: [yaml]
        files: >-
          (?:^|/)(?:compose|docker-compose|podman-compose)\.ya?ml$

      - id: check-json
        name: Validate JSON with jq
        entry: jq empty
        language: system
        types: [json]

      - id: gitleaks
        name: Gitleaks
        entry: gitleaks protect --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
