---
- name: Candidate backend guard installation
  hosts: all
  gather_facts: false
  vars:
    candidate_execution_enabled: false
  pre_tasks:
    - name: Block unqualified candidate before contact
      ansible.builtin.assert:
        that:
          - candidate_execution_enabled | bool
          - guard_qualification_verified | default(false) | bool
          - stopped_backend_verified | default(false) | bool
          - guard_baseline_absent_verified | default(false) | bool
      delegate_to: localhost
      become: false
  tasks:
    - name: Preserve a new protected operation directory
      become: true
      ansible.builtin.stat:
        path: /var/lib/nautobot-backend-install
      register: guard_old_operation
    - name: Require fresh operation evidence
      ansible.builtin.assert:
        that: not guard_old_operation.stat.exists
    - name: Create evidence directory
      become: true
      ansible.builtin.file:
        path: /var/lib/nautobot-backend-install
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Stage independent recovery tools
      become: true
      ansible.builtin.copy:
        src: '../scripts/{{ item }}'
        dest: '/var/lib/nautobot-backend-install/{{ item }}'
        owner: root
        group: root
        mode: '0600'
      loop: [backend_guard.py, network_policy.py, rollback_install.py, install_state.py]
    - name: Stage exact first-install manifest
      become: true
      ansible.builtin.copy:
        src: ../rendered/installation.json
        dest: /var/lib/nautobot-backend-install/inputs.json
        owner: root
        group: root
        mode: '0600'
    - name: Verify live baseline and persist rollback state
      become: true
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, /var/lib/nautobot-backend-install/install_state.py, prepare]
      changed_when: true
    - name: Arm independent rollback before install
      become: true
      ansible.builtin.command:
        argv: [systemd-run, --unit=nautobot-backend-install-rollback, --on-active=300s,
               /usr/bin/python3, -I, /var/lib/nautobot-backend-install/rollback_install.py]
      changed_when: true
    - name: Install and verify persistent guard
      block:
        - name: Create owned artifact directories
          become: true
          ansible.builtin.file:
            path: '{{ item }}'
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop: [/etc/nautobot-backend, /usr/local/lib/nautobot-network, /etc/systemd/system/user@999.service.d]
        - name: Stage guard inputs
          become: true
          ansible.builtin.copy:
            src: '{{ item.src }}'
            dest: '{{ item.dest }}'
            owner: root
            group: root
            mode: '0644'
          loop:
            - {src: ../scripts/backend_guard.py, dest: /usr/local/lib/nautobot-network/backend_guard.py}
            - {src: ../scripts/network_policy.py, dest: /usr/local/lib/nautobot-network/network_policy.py}
            - {src: ../rendered/rules.nft, dest: /etc/nautobot-backend/rules.nft}
            - {src: ../rendered/expected-table.sha256, dest: /etc/nautobot-backend/expected-table.sha256}
            - {src: ../templates/nautobot-backend-guard.service, dest: /etc/systemd/system/nautobot-backend-guard.service}
            - {src: ../templates/user-manager.conf, dest: /etc/systemd/system/user@999.service.d/50-nautobot-network.conf}
        - name: Install read-only verifier permission
          become: true
          ansible.builtin.copy:
            src: ../templates/nautobot-network.sudoers
            dest: /etc/sudoers.d/nautobot-network
            owner: root
            group: root
            mode: '0440'
            validate: /usr/sbin/visudo -cf %s
        - name: Start persistent guard
          become: true
          ansible.builtin.systemd_service:
            name: nautobot-backend-guard.service
            daemon_reload: true
            enabled: true
            state: started
        - name: Verify effective rules independently of unit state
          become: true
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, /usr/local/lib/nautobot-network/backend_guard.py, check]
          changed_when: false
        - name: Accept guard installation only and disarm watchdog
          become: true
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, /var/lib/nautobot-backend-install/install_state.py, accept]
          changed_when: true
      rescue:
        - name: Restore absent-file baseline while retaining evidence
          become: true
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, /var/lib/nautobot-backend-install/rollback_install.py]
          changed_when: true
        - name: Report failed installation after recovery attempt
          ansible.builtin.fail:
            msg: Guard installation failed; review retained rollback state before retry.
